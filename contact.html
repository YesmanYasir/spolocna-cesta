<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Spoločná cesta</title>
  <meta name="description" content="Contact Spoločná cesta by email, phone, or at our Bratislava address.">
  <meta name="theme-color" content="#f7f8fc">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body class="page-contact">
  <main class="page-wrap page-wrap--contact">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      Back to links
    </a>

    <header class="contact-intro">
      <div class="brand-mark-frame brand-mark-frame--small">
        <img class="brand-mark" src="logor.png" alt="Spoločná cesta logo" width="80" height="65">
      </div>
      <p class="brand-eyebrow">Spoločná cesta</p>
      <h1 class="brand-name">Get in touch</h1>
      <p class="brand-tagline">We're here for you.</p>
    </header>

    <section class="surface-card" aria-labelledby="contact-details-heading">
      <h2 class="card-heading" id="contact-details-heading">Contact details</h2>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        <div>
          <p class="contact-label">Email</p>
          <p class="contact-value"><a href="mailto:info@spolocnacesta.sk">info@spolocnacesta.sk</a></p>
        </div>
      </div>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.7 4.2-2 1.6a15.5 15.5 0 0 0 5.5 5.5l1.6-2 4.2 1.7v3c0 1-.8 1.8-1.8 1.8C10.3 19.3 4.7 13.7 4.7 6.3c0-1.5.8-2.8 1.8-2.8z"/></svg>
        </span>
        <div>
          <p class="contact-label">Phone</p>
          <p class="contact-value"><a href="tel:+421903497094">+421 903 497 094</a></p>
        </div>
      </div>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0z"/><circle cx="12" cy="10" r="2.3"/></svg>
        </span>
        <div>
          <p class="contact-label">Address</p>
          <p class="contact-value">
            <a href="https://maps.google.com/?q=Michalska%2012%2C%20811%2001%2C%20Bratislava" target="_blank" rel="noopener noreferrer">
              Michalská 12, 811 01, Bratislava <span class="external-arrow" aria-hidden="true">↗</span>
            </a>
          </p>
        </div>
      </div>
    </section>

    <section class="surface-card" aria-labelledby="message-heading">
      <h2 class="card-heading" id="message-heading">Send us a message</h2>
      <form id="contactForm" action="mailto:info@spolocnacesta.sk" method="POST" enctype="text/plain">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="Name" type="text" placeholder="Your name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="Email" type="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="4" placeholder="Tell us how we can help…" required></textarea>
        </div>
        <button class="submit-button" type="submit">Send message <span aria-hidden="true">→</span></button>
      </form>
      <p class="form-note">Your email app will open with the message ready to send.</p>
    </section>

    <footer class="site-footer site-footer--contact">
      <p class="copyright">© 2026 Spoločná cesta</p>
    </footer>
  </main>
</body>
</html>
